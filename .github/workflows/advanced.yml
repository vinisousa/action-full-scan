on: [push]

# Give the workflow the minimal permissions the action needs
permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the webapplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Ensure ZAP rules file exists
        run: |
          mkdir -p .zap
          if [ ! -f .zap/rules.tsv ]; then
            cat > .zap/rules.tsv <<'TSV'
rule_id\trule_description
10001\tExample: In Page Banner Information Leak
10015\tExample: Re-examine Cache-control Directives
TSV
            echo "Created .zap/rules.tsv (default)."
          else
            echo ".zap/rules.tsv already exists."
          fi

      - name: ZAP Scan
        uses: vinisousa/action-full-scan@v0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://bank.vsousa.f5latam.app/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
